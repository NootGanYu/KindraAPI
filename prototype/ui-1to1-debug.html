<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · API 调试页 1:1 对照</title>
<!--
  目标：外壳 + API 调试页的高保真对照原型。
  参考尺寸：1162 × 656（docs/images/02-debug.jpg）。
  说明：图标为开源风格重绘近似，不复制原应用 iconfont/品牌资产。
  顶部控制条不属于设计，只用于“设计 / 参考 / 并排 / 叠加 / 网格”对照。
-->
<style>
  :root{
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    --page:#faf5ea;
    --header:#f4eddf;
    --rail:#f3ead8;
    --tree:#faf5ea;
    --white:#ffffff;
    --line:rgba(147,117,63,.16);
    --line2:rgba(147,117,63,.32);
    --ink:#2c2214;
    --text:#6b5d48;
    --muted:#9c9080;
    --primary:#8a6b3b;
    --primary-dark:#715830;
    --primary-soft:#f3ead8;
    --primary-hover:rgba(156,124,74,.14);
    --blue:#097bed;
    --green:#39a06a;
    --red:#ff583e;
    --success:#26cea4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#cfc9bd;font-family:var(--sans);color:var(--ink)}
  button,input,textarea{font-family:inherit}
  button{border:none;background:none;padding:0;cursor:pointer;color:inherit}
  .grow{flex:1}
  .ic{display:block;flex:none}

  /* ---------- prototype controls (not part of the UI) ---------- */
  .proto-bar{
    position:sticky;top:0;z-index:100;
    height:56px;display:flex;align-items:center;gap:16px;padding:0 18px;
    background:#211d17;color:#f4eee2;box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .proto-title{display:flex;flex-direction:column;line-height:1.25;min-width:255px}
  .proto-title b{font-size:13px;letter-spacing:.02em}
  .proto-title span{font-size:10px;color:#a89c88;letter-spacing:.03em}
  .proto-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .pseg{display:flex;padding:3px;border-radius:7px;background:#2c271f;gap:2px}
  .pseg button{padding:5px 11px;border-radius:5px;font-size:11.5px;color:#b7ac99}
  .pseg button.active{background:#f3ead8;color:#4b3b23;font-weight:600}
  .pctl{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#b7ac99}
  .pctl input[type="range"]{width:92px;accent-color:#c8a25e}
  .pctl input[type="checkbox"]{accent-color:#c8a25e}
  .pctl button{padding:4px 8px;border:1px solid #4a4236;border-radius:5px;color:#e8dfcf;background:#2c271f;font-size:10.5px}
  .pctl button:hover{border-color:#8a6b3b;color:#fff}
  .proto-note{margin-left:auto;font-size:10px;color:#8e8270}

  /* ---------- stage ---------- */
  .stage{
    min-height:calc(100vh - 56px);padding:20px;display:flex;gap:18px;
    align-items:flex-start;justify-content:flex-start;overflow:auto;
  }
  .canvas-wrap{
    position:relative;flex:none;width:1162px;height:656px;background:#fff;
    box-shadow:0 16px 46px rgba(40,30,15,.28);transform-origin:top left;
  }
  .ref-wrap{position:relative;flex:none;width:1162px;height:656px;box-shadow:0 16px 46px rgba(40,30,15,.28)}
  .ref-wrap img{display:block;width:1162px;height:656px}
  .ref-overlay{
    position:absolute;left:0;top:0;width:1162px;height:656px;
    pointer-events:none;opacity:0;transition:opacity .12s;
  }
  .grid-overlay{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background-image:
      linear-gradient(to right, rgba(180,70,40,.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(180,70,40,.18) 1px, transparent 1px);
    background-size:8px 8px;
  }
  .grid-overlay.on{opacity:1}

  /* ---------- app shell ---------- */
  .app{
    width:1162px;height:656px;display:flex;flex-direction:column;overflow:hidden;
    background:var(--page);color:var(--ink);font-size:12px;line-height:1.4;
  }

  /* top bar */
  .topbar{
    height:44px;flex:none;display:flex;align-items:center;position:relative;
    padding:0 26px 0 88px;background:var(--header);border-bottom:1px solid var(--line);
  }
  .top-left{display:flex;align-items:center;gap:36px;min-width:0}
  .brand{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
  .logo{
    width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#c8a25e,#8a6b3b);
  }
  .new-project{
    height:26px;display:flex;align-items:center;gap:5px;padding:0 10px;
    border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.55);
    color:#5b4d38;font-size:12px;white-space:nowrap;
  }
  .new-project:hover{background:#fffdf8;border-color:var(--line2)}
  .top-center{
    flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:22px;
  }
  .project-switch{display:flex;align-items:center;gap:5px;font-size:12px;color:#5b4d38;white-space:nowrap}
  .project-switch:hover{color:var(--primary)}
  .text-btn{font-size:12px;color:#5b4d38;white-space:nowrap}
  .text-btn:hover{color:var(--primary)}
  .icon-btn{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:#7b6e59}
  .icon-btn:hover{background:var(--primary-hover);color:var(--primary)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:16px}
  .ai{display:flex;align-items:center;gap:4px;color:var(--primary);font-size:12.5px}
  .mcp{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#6b5d48;white-space:nowrap}
  .green-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
  .toggle{width:26px;height:14px;border-radius:999px;background:#c9bfa9;position:relative;display:inline-block;flex:none}
  .toggle.on{background:var(--primary)}
  .toggle i{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;top:2px;left:2px}
  .toggle.on i{left:auto;right:2px}

  /* shell */
  .shell{flex:1;min-height:0;display:flex}
  .rail{
    width:50px;flex:none;background:var(--rail);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:9px 0 6px;gap:0;
  }
  .rail-btn{
    width:42px;height:46px;margin-bottom:18px;border-radius:6px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding-top:5px;gap:6px;color:#6b5d48;font-size:10px;line-height:1.1;
  }
  .rail-btn:hover{color:var(--primary)}
  .rail-btn.active{background:var(--primary-hover);color:var(--primary);font-weight:500}
  .rail-btn.icon-only{height:40px;margin-bottom:0;padding-top:0;justify-content:center}
  .rail-gap{height:30px;flex:none}
  .rail-spacer{flex:1}

  .tree{
    width:255px;flex:none;background:var(--tree);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:12px 12px 10px 14px;min-height:0;
  }
  .tree-search-row{display:flex;gap:6px;align-items:center;flex:none}
  .tree-search{
    flex:1;min-width:0;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;
    background:#fffdf8;border:1px solid var(--line);border-radius:4px;color:var(--muted);
  }
  .tree-search .placeholder{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree-search .filter{display:flex;align-items:center;gap:3px;font-size:12px;color:#6b5d48;white-space:nowrap}
  .tree-plus{
    width:32px;height:32px;flex:none;border-radius:4px;background:var(--primary);color:#fff;
    display:grid;place-items:center;
  }
  .tree-plus:hover{background:var(--primary-dark)}
  .tree-all{
    height:28px;display:flex;align-items:center;gap:6px;margin-top:5px;
    font-size:12px;color:#6b5d48;flex:none;
  }
  .tree-all .mini{width:22px;height:22px;color:#8e8069}
  .tree-list{flex:1;min-height:0;overflow:auto;padding-top:2px}
  .folder-row{
    width:100%;height:29px;display:flex;align-items:center;gap:6px;padding:0 4px;
    border-radius:4px;font-size:12px;color:#5b4d38;text-align:left;
  }
  .folder-row:hover{background:var(--primary-hover)}
  .folder-icon{color:#a58a58;display:flex}
  .folder-row .chev{color:#9c9080;transition:transform .12s}
  .folder-row .chev.open{transform:rotate(90deg)}
  .api-row{
    width:100%;height:29px;display:flex;align-items:center;gap:7px;padding:0 4px 0 22px;
    border-radius:4px;font-size:12px;color:#5b4d38;text-align:left;
  }
  .api-row:hover{background:var(--primary-hover)}
  .method-text{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#b8862b;letter-spacing:.02em}
  .tree-new{
    width:100%;height:31px;margin-top:9px;display:flex;align-items:center;justify-content:center;gap:4px;
    border:1px dashed var(--line2);border-radius:4px;color:#8e8069;font-size:12px;background:transparent;
  }
  .tree-new:hover{color:var(--primary);border-color:var(--primary)}

  .vdivider{
    width:8px;flex:none;background:var(--page);display:flex;align-items:center;justify-content:center;
    cursor:col-resize;
  }
  .vdivider span{width:4px;height:24px;border-radius:3px;background:#e6ddcc}

  .main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}

  /* tab bar */
  .tabbar{
    height:38px;flex:none;display:flex;align-items:flex-end;gap:3px;padding:0 4px;
    background:var(--page);
  }
  .filetab{
    height:28px;display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid transparent;
    border-bottom:none;border-radius:4px 4px 0 0;color:#6b5d48;font-size:12px;white-space:nowrap;
  }
  .filetab.active{background:var(--white);border-color:var(--line);color:#4b3b23}
  .filetab .method-text{font-size:10.5px}
  .red-dot{width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block}
  .tab-x{color:#a99c86;font-size:12px;margin-left:1px}
  .tab-add,.tab-more{width:24px;height:24px;display:grid;place-items:center;color:#8e8069;border-radius:4px;margin-bottom:2px}
  .tab-add:hover,.tab-more:hover{background:var(--primary-hover);color:var(--primary)}
  .env-pill{
    height:26px;display:flex;align-items:center;gap:5px;padding:0 8px;margin-bottom:4px;
    background:#fffdf8;border:1px solid var(--line);border-radius:4px;color:#5b4d38;font-size:12px;white-space:nowrap;
  }
  .env-pill:hover{border-color:var(--line2)}
  .env-ico{color:var(--blue);display:flex}

  /* surface */
  .surface{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--white);overflow:hidden}

  .mode-row{
    height:55px;flex:none;display:flex;align-items:center;gap:18px;padding:0 17px;
  }
  .segmented{
    height:36px;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:4px;
    background:#fffdf8;overflow:hidden;flex:none;
  }
  .segmented button{
    padding:0 14px;font-size:13px;color:#6b5d48;height:34px;display:flex;align-items:center;
  }
  .segmented button:hover{color:var(--primary)}
  .segmented button.active{background:var(--primary-soft);color:#4b3b23;font-weight:500}
  .api-meta{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
  .dev-state{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b5d48;white-space:nowrap}
  .dev-state i{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}
  .api-name{
    flex:1;min-width:210px;max-width:none;font-size:14px;color:#3e3324;padding:1px 4px 2px;
    border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .share-btn{
    height:28px;display:flex;align-items:center;gap:5px;padding:0 10px;
    border:1px solid var(--line);border-radius:4px;color:#5b4d38;font-size:12px;background:#fffdf8;
  }
  .share-btn:hover{border-color:var(--line2)}
  .mini{width:26px;height:26px;display:grid;place-items:center;border-radius:4px;color:#8e8069}
  .mini:hover{background:var(--primary-hover);color:var(--primary)}

  /* url row */
  .url-row{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px}
  .url-capsule{
    flex:1;min-width:0;height:34px;display:flex;align-items:stretch;background:var(--page);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;
  }
  .method-select{
    width:92px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
    background:#fffdf8;border-right:1px solid var(--line);color:#b8862b;
    font-family:var(--mono);font-size:12px;font-weight:700;
  }
  .method-select:hover{background:#fff}
  .url-input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;padding:0 10px;
    color:#4b3b23;font-size:13px;
  }
  .url-input::placeholder{color:#9c9080}
  .proto-select{
    width:100px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:0 10px;
    font-family:var(--mono);font-size:12px;color:#6b5d48;
  }
  .send-group,.save-group{
    height:34px;display:flex;align-items:stretch;border-radius:4px;overflow:hidden;flex:none;
  }
  .send-group{background:var(--primary)}
  .send-btn{padding:0 16px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center}
  .send-caret{width:22px;display:grid;place-items:center;color:#fff;border-left:1px solid rgba(255,255,255,.22)}
  .send-btn:hover,.send-caret:hover{background:var(--primary-dark)}
  .save-group{border:1px solid var(--line2);background:#fff}
  .save-btn{padding:0 14px;font-size:14px;color:#5b4d38;display:flex;align-items:center}
  .save-caret{width:22px;display:grid;place-items:center;color:#8e8069;border-left:1px solid var(--line)}
  .save-btn:hover,.save-caret:hover{background:#faf5ea}

  /* request tabs / body */
  .req-tabs{
    height:44px;flex:none;display:flex;align-items:stretch;gap:26px;padding:0 17px;
    border-bottom:1px solid var(--line);overflow:hidden;
  }
  .req-tabs button{
    position:relative;padding:3px 0 0;font-size:13px;color:#5b4d38;display:flex;align-items:center;white-space:nowrap;
  }
  .req-tabs button:hover{color:var(--primary)}
  .req-tabs button.active{color:#2c2214;font-weight:500}
  .req-tabs button.active::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#5a4628;
  }
  .req-body{
    flex:43 1 0;min-height:150px;display:flex;flex-direction:column;padding:14px 17px 0;min-width:0;
  }
  .bodytypes{height:28px;flex:none;display:flex;align-items:center;gap:18px;font-size:12px;color:#6b5d48}
  .radio{display:flex;align-items:center;gap:6px;white-space:nowrap;color:#6b5d48}
  .radio i{
    width:12px;height:12px;border-radius:50%;border:1px solid #c3b7a1;display:inline-grid;place-items:center;flex:none;
  }
  .radio.on{color:#2c2214;font-weight:500}
  .radio.on i{border-color:#7a5c30}
  .radio.on i::after{content:"";width:6px;height:6px;border-radius:50%;background:#7a5c30}
  .editor-shell{
    position:relative;flex:1;min-height:0;margin-top:8px;border:1px solid var(--line);border-radius:2px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:auto;
  }
  .fake-scroll{
    position:absolute;top:4px;right:2px;bottom:4px;width:7px;border-radius:4px;
    background:rgba(234,224,203,.35);pointer-events:none;
  }
  .fake-scroll span{
    display:block;width:7px;height:112px;border-radius:4px;background:#eae0cb;
  }
  .editor-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#7b6e59;font-size:12px}
  .editor-empty svg{opacity:.85}
  .editor-empty span{transform:translateY(-12px)}
  .editor-input{
    width:100%;height:100%;border:none;outline:none;resize:none;padding:12px 14px;
    font-family:var(--mono);font-size:12px;line-height:1.55;color:#3d352a;background:#fff;
  }
  .simple-table{width:100%;border-collapse:collapse;font-size:11.5px;align-self:flex-start}
  .simple-table th{text-align:left;font-weight:600;color:#9c9080;padding:6px 8px;background:#faf5ea;border-bottom:1px solid var(--line)}
  .simple-table td{padding:6px 8px;border-bottom:1px solid #f1ebdf;font-family:var(--mono);color:#4b3b23}
  .code-pad{padding:12px 14px;font-family:var(--mono);font-size:12px;color:#4b3b23;white-space:pre;width:100%}

  .hsplit{
    height:6px;flex:none;background:#fff;border-top:1px solid var(--line);
    position:relative;display:flex;align-items:center;justify-content:center;cursor:row-resize;
  }
  .hsplit span{
    width:9px;height:24px;border-radius:3px;background:#f3ead8;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;
  }
  .hsplit:hover span{opacity:1}
  .hsplit span::before{content:"";width:2px;height:2px;border-radius:50%;background:#b9ad98;box-shadow:0 3px 0 #b9ad98,0 -3px 0 #b9ad98}

  .resp{flex:57 1 0;min-height:0;position:relative;display:flex;flex-direction:column}
  .resp-tabs{
    height:40px;flex:none;display:flex;align-items:stretch;gap:26px;padding:0 17px;
    border-bottom:1px solid var(--line);
  }
  .resp-tabs button{
    position:relative;padding:0 0 4px;font-size:13px;color:#5b4d38;display:flex;align-items:center;white-space:nowrap;
  }
  .resp-tabs button:hover{color:var(--primary)}
  .resp-tabs button.active{color:#2c2214;font-weight:500}
  .resp-tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#5a4628}
  .resp-toolbar{
    height:28px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;
    font-size:10.5px;color:#9c9080;border-bottom:1px solid var(--line);
  }
  .resp-toolbar .on{color:#6b5d48;font-weight:600}
  .resp-empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;color:#8e8069;font-size:12px;padding-bottom:16px;
  }
  .resp-empty svg{opacity:.9}
  .resp-filled{flex:1;min-height:0;overflow:auto;padding:10px 14px 16px}
  .resp-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:#6b5d48;margin-bottom:8px;flex-wrap:wrap}
  .status-code{font-family:var(--mono);font-weight:700;color:#2f7d4f}
  .resp-code{
    margin:0;padding:10px 12px;background:#fbf8f1;border:1px solid var(--line);border-radius:3px;
    font-family:var(--mono);font-size:12px;line-height:1.55;color:#3d352a;white-space:pre-wrap;word-break:break-all;
  }
  .split-toggle{
    position:absolute;right:26px;bottom:38px;width:28px;height:28px;display:grid;place-items:center;
    background:#fff;border:1px solid var(--line2);border-radius:4px;color:#8e8069;
  }
  .split-toggle:hover{border-color:var(--primary);color:var(--primary)}

  .statusbar{
    height:28px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;
    background:#fff;border-top:1px solid var(--line);font-size:11px;color:#9c9080;
  }
  .statusbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
  .statusbar .link{color:#6b5d48;cursor:pointer}
</style>
</head>
<body>

<div class="proto-bar">
  <div class="proto-title">
    <b>API 调试页 · 1:1 对照原型</b>
    <span>参考：docs/images/02-debug.jpg · 1162 × 656</span>
  </div>
  <div class="proto-controls">
    <div class="pseg" id="modeSeg">
      <button data-pmode="design" class="active">设计</button>
      <button data-pmode="reference">参考</button>
      <button data-pmode="side">并排</button>
      <button data-pmode="overlay">叠加</button>
    </div>
    <label class="pctl">缩放 <input type="range" id="zoom" min="40" max="100" value="100" /> <span id="zoomVal">100%</span></label>
    <label class="pctl"><input type="checkbox" id="gridToggle" /> 8px 网格</label>
    <label class="pctl"><input type="checkbox" id="statusToggle" /> 底部状态栏</label>
    <label class="pctl"><input type="checkbox" id="filledToggle" /> 有响应</label>
    <label class="pctl">叠加透明度 <input type="range" id="opacity" min="0" max="100" value="45" /> <span id="opacityVal">45%</span></label>
    <div class="pctl"><button id="resetBtn">重置</button></div>
  </div>
  <div class="proto-note">图标为开源风格重绘近似</div>
</div>

<div class="stage" id="stage">
  <div class="canvas-wrap" id="designWrap">
    <div id="designCanvas"></div>
    <img class="ref-overlay" id="refOverlay" src="../docs/images/02-debug.jpg" alt="reference" />
    <div class="grid-overlay" id="gridOverlay"></div>
  </div>
  <div class="ref-wrap" id="refWrap" hidden>
    <img src="../docs/images/02-debug.jpg" alt="reference screenshot" />
  </div>
</div>

<script>
/* =====================================================================
   Icons（开源风格重绘，非原应用资产）
   ===================================================================== */
const ICONS = {
  history: '<path d="M8 3a5 5 0 1 1-4.9 6"/><path d="M3 5v4h4"/><path d="M8 5v3l2 1"/>',
  api: '<rect x="2.7" y="3" width="10.6" height="10" rx="1.6"/><path d="M6.2 6.2 5 8l1.2 1.8M9.8 6.2 11 8l-1.2 1.8"/>',
  docs: '<path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3"/><path d="M6 9h4M6 11h4"/>',
  dict: '<ellipse cx="8" cy="4" rx="4.5" ry="2"/><path d="M3.5 4v8c0 1.1 2 2 4.5 2s4.5-.9 4.5-2V4"/><path d="M3.5 8c0 1.1 2 2 4.5 2s4.5-.9 4.5-2"/>',
  settings: '<circle cx="8" cy="8" r="2.2"/><path d="M8 2.5v1.4M8 12.1v1.4M2.5 8h1.4M12.1 8h1.4M4.1 4.1l1 1M10.9 10.9l1 1M11.9 4.1l-1 1M5.1 10.9l-1 1"/>',
  git: '<circle cx="4.5" cy="4" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/><circle cx="11.5" cy="7" r="1.5"/><path d="M4.5 5.5v5M6 7h4"/>',
  trash: '<path d="M3 5h10M6 5V3.5h4V5M5 5l.6 8.5h4.8L11 5"/><path d="M6.8 7.5v4M9.2 7.5v4"/>',
  search: '<circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3 3"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  filter: '<path d="M3 4h10M5 8h6M7 12h2"/>',
  refresh: '<path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 3v3.5H9.5"/>',
  sort: '<path d="M5 3v10M5 13 3 11M5 13l2-2M11 13V3M11 3 9 5M11 3l2 2"/>',
  collapse: '<path d="M4 6l4 4 4-4"/><path d="M4 10l4 4 4-4"/>',
  share: '<path d="M11 6.5V13H3V5h6.5"/><path d="M8.5 3H13v4M13 3 7.5 8.5"/>',
  more: '<circle cx="3.5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12.5" cy="8" r="1"/>',
  menu: '<path d="M3 5h10M3 8h10M3 11h10"/>',
  chevron: '<path d="m5 6.5 3 3 3-3"/>',
  chevronRight: '<path d="m6.5 5 3 3-3 3"/>',
  globe: '<circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.8 1.5 1.8 9.5 0 11M8 2.5c-1.8 1.5-1.8 9.5 0 11"/>',
  folder: '<path d="M2.5 4.5h4l1.2 1.5h5.8v7h-11z"/>',
  folderOpen: '<path d="M2.5 5h4l1.2 1.5h5.8"/><path d="M3 12.5 4.8 7h9.2l-1.6 5.5z"/>',
  spark: '<path d="M8 2.5 9.2 6l3.5 1.2L9.2 8.4 8 12l-1.2-3.6L3.3 7.2 6.8 6z"/>',
  grid: '<rect x="3" y="3" width="10" height="10" rx="1.2"/><path d="M8 3v10M3 8h10"/>'
};

function icon(name, size = 16, cls = '') {
  return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

const ILLU = {
  doc: `<svg width="62" height="62" viewBox="0 0 64 64" fill="none" stroke="#c9bfa9" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 10h19l9 9v30a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/>
    <path d="M37 10v10h10"/><path d="M24 31h15M24 37h11"/>
    <path d="M48 16l1.7 4.3L54 22l-4.3 1.7L48 28l-1.7-4.3L42 22l4.3-1.7z" opacity=".65"/>
    <circle cx="21" cy="45" r="1.2" opacity=".7"/><circle cx="47" cy="42" r="1" opacity=".6"/>
  </svg>`,
  rocket: `<svg width="76" height="76" viewBox="0 0 76 76" fill="none" stroke="#c9bfa9" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 11c8.5 6.2 12.5 15.5 12.5 25L45 44H31l-5.5-8c0-9.5 4-18.8 12.5-25z"/>
    <circle cx="38" cy="28" r="4.2"/>
    <path d="M31 44l-6.5 10.5L38 51l13.5 3.5L45 44"/>
    <path d="M18 25c10-5.5 30-5.5 40 0" opacity=".45"/>
    <path d="M55 15l1.3 3.2L59.5 19l-3.2 1.3L55 23.5l-1.3-3.2L50.5 19l3.2-.8z" opacity=".55"/>
    <circle cx="20" cy="47" r="1.2" opacity=".6"/><circle cx="58" cy="45" r="1.5" opacity=".55"/>
  </svg>`
};

/* =====================================================================
   App state
   ===================================================================== */
const state = {
  mode: '调试',
  reqTab: 'Body',
  bodyType: 'none',
  respTab: '实时响应',
  folderOpen: false,
  responseFilled: false,
  statusbar: false
};

const REQ_TABS = ['Header','Query','Path','Body','认证','Cookie','预执行操作','后执行操作'];
const RESP_TABS = ['实时响应','响应头','Cookie','响应示例','实际请求','控制台'];
const BODY_TYPES = ['none','form-data','urlencoded','binary','msgpack','raw'];
const MODES = ['设计','调试','接口用例','一键压测','Mock'];

/* =====================================================================
   Render
   ===================================================================== */
function topbar() {
  return `<header class="topbar">
    <div class="top-left">
      <div class="brand">
        <span class="logo">${icon('spark', 11)}</span>
        <span>Apipost 单机版</span>
      </div>
      <button class="new-project">${icon('plus', 11)} 新建/导入项目</button>
    </div>
    <div class="top-center">
      <button class="project-switch">${icon('folder', 14)} 默认项目 ${icon('chevron', 9)}</button>
      <button class="text-btn">打开位置</button>
      <button class="icon-btn">${icon('refresh', 14)}</button>
    </div>
    <div class="top-right">
      <button class="text-btn ai">${icon('spark', 11)} AI 执行计划</button>
      <span class="mcp"><i class="green-dot"></i> MCP连接 运行中</span>
      <span class="toggle on"><i></i></span>
    </div>
  </header>`;
}

function rail() {
  const items = [['history','最近'],['api','APIs'],['docs','文档'],['dict','字典'],['settings','配置']];
  return `<nav class="rail">
    ${items.map(([key,label], index) => `<button class="rail-btn${index === 1 ? ' active' : ''}">${icon(key, 16)}<span>${label}</span></button>`).join('')}
    <span class="rail-gap"></span>
    <button class="rail-btn">${icon('git', 16)}<span>Git</span></button>
    <span class="rail-spacer"></span>
    <button class="rail-btn icon-only">${icon('trash', 16)}</button>
  </nav>`;
}

function tree() {
  return `<aside class="tree">
    <div class="tree-search-row">
      <div class="tree-search">
        ${icon('search', 14)}
        <span class="placeholder">关键字/URL</span>
        <span class="filter">全部 ${icon('chevron', 9)}</span>
      </div>
      <button class="tree-plus">${icon('plus', 14)}</button>
    </div>
    <div class="tree-all">
      ${icon('folderOpen', 14)}<span>全部接口</span><span class="grow"></span>
      <button class="mini">${icon('refresh', 13)}</button>
      <button class="mini">${icon('sort', 13)}</button>
      <button class="mini">${icon('collapse', 13)}</button>
    </div>
    <div class="tree-list">
      <button class="folder-row" data-act="folder">
        ${icon('chevronRight', 9, 'chev' + (state.folderOpen ? ' open' : ''))}
        <span class="folder-icon">${icon('folder', 15)}</span>
        <span>Mcp测试</span>
      </button>
      ${state.folderOpen ? `<button class="api-row"><span class="method-text">POST</span><span>未命名接口</span></button>` : ''}
      <button class="tree-new">${icon('plus', 12)} 新建</button>
    </div>
  </aside>`;
}

function tabbar() {
  return `<div class="tabbar">
    <div class="filetab active">
      <span class="method-text">POST</span>
      <span>未命名接口</span>
      <span class="red-dot"></span>
      <span class="tab-x">×</span>
    </div>
    <button class="tab-add">${icon('plus', 13)}</button>
    <button class="tab-more">${icon('more', 13)}</button>
    <span class="grow"></span>
    <button class="env-pill"><span class="env-ico">${icon('globe', 12)}</span> 默认环境 ${icon('chevron', 9)}</button>
    <button class="icon-btn">${icon('menu', 14)}</button>
  </div>`;
}

function modeRow() {
  return `<div class="mode-row">
    <div class="segmented">
      ${MODES.map((mode) => `<button class="${state.mode === mode ? 'active' : ''}" data-act="mode:${mode}">${mode}</button>`).join('')}
    </div>
    <div class="api-meta">
      <span class="dev-state"><i></i> 开发中 ${icon('chevron', 9)}</span>
      <span class="api-name">未命名接口</span>
      <button class="mini">${icon('filter', 14)}</button>
      <button class="share-btn">${icon('share', 13)} 分享</button>
      <button class="mini">${icon('more', 14)}</button>
    </div>
  </div>`;
}

function urlRow() {
  return `<div class="url-row">
    <div class="url-capsule">
      <button class="method-select">POST ${icon('chevron', 9)}</button>
      <input class="url-input" placeholder="请输入URL或粘贴cURL文本" />
      <button class="proto-select">http/1.1 ${icon('chevron', 9)}</button>
    </div>
    <div class="send-group">
      <button class="send-btn" data-act="send">发送</button>
      <button class="send-caret">${icon('chevron', 9)}</button>
    </div>
    <div class="save-group">
      <button class="save-btn">保存</button>
      <button class="save-caret">${icon('chevron', 9)}</button>
    </div>
  </div>`;
}

function reqTabs() {
  return `<div class="req-tabs">
    ${REQ_TABS.map((tab) => `<button class="${state.reqTab === tab ? 'active' : ''}" data-act="reqtab:${tab}">${tab}</button>`).join('')}
  </div>`;
}

function reqBody() {
  if (state.reqTab === 'Body') {
    const isEmpty = state.bodyType === 'none';
    return `<div class="req-body">
      <div class="bodytypes">
        ${BODY_TYPES.map((type) => `<button class="radio ${state.bodyType === type ? 'on' : ''}" data-act="bodytype:${type}"><i></i>${type}</button>`).join('')}
      </div>
      <div class="editor-shell">
        ${isEmpty
          ? `<div class="editor-empty">${ILLU.doc}<span>当前请求未包含 Body</span></div><div class="fake-scroll"><span></span></div>`
          : `<textarea class="editor-input" spellcheck="false" placeholder='{ "key": "value" }'></textarea>`}
      </div>
    </div>`;
  }

  if (state.reqTab === 'Header') {
    return `<div class="req-body"><div class="editor-shell" style="align-items:flex-start;justify-content:flex-start">
      <table class="simple-table">
        <tr><th>Key</th><th>Value</th></tr>
        <tr><td>Content-Type</td><td>application/json</td></tr>
      </table>
    </div></div>`;
  }
  if (state.reqTab === 'Query' || state.reqTab === 'Path' || state.reqTab === 'Cookie') {
    return `<div class="req-body"><div class="editor-shell" style="align-items:flex-start;justify-content:flex-start">
      <table class="simple-table">
        <tr><th>Key</th><th>Value</th></tr>
        <tr><td>—</td><td>暂无参数</td></tr>
      </table>
    </div></div>`;
  }
  if (state.reqTab === '认证') {
    return `<div class="req-body"><div class="editor-shell" style="align-items:flex-start;justify-content:flex-start">
      <table class="simple-table">
        <tr><th>认证方式</th><th>值</th></tr>
        <tr><td>无需认证</td><td>—</td></tr>
      </table>
    </div></div>`;
  }
  return `<div class="req-body"><div class="editor-shell" style="align-items:flex-start;justify-content:flex-start">
    <pre class="code-pad">// ${state.reqTab}\n// 脚本编辑区</pre>
  </div></div>`;
}

function hsplit() {
  return `<div class="hsplit"><span></span></div>`;
}

function resp() {
  const filled = state.responseFilled;
  return `<section class="resp">
    <div class="resp-tabs">
      ${RESP_TABS.map((tab) => `<button class="${state.respTab === tab ? 'active' : ''}" data-act="resptab:${tab}">${tab}</button>`).join('')}
    </div>
    ${filled ? `<div class="resp-toolbar"><span class="on">美化</span><span>原生</span><span>预览</span><span>可视化</span><span>表格</span></div>` : ''}
    ${filled
      ? `<div class="resp-filled">
          <div class="resp-meta">
            <span class="status-code">201 Created</span>
            <span>84 ms</span><span>36 B</span><span>application/json</span>
          </div>
          <pre class="resp-code">{
  "id": 7,
  "name": "Ada",
  "created": true
}</pre>
        </div>`
      : `<div class="resp-empty">${ILLU.rocket}<span>请输入url点击发送按钮获取响应结果</span></div>`}
    <button class="split-toggle" title="切换分屏方向">${icon('grid', 15)}</button>
  </section>`;
}

function statusbar() {
  return `<footer class="statusbar">
    <span>精简模式</span>
    <span>软件序列号：80A8463B-…-6D8ACE5C</span>
    <span class="right"><span>⚠ 试用已结束</span><span class="link">⚙ 设置</span></span>
  </footer>`;
}

function appHTML() {
  return `<div class="app">
    ${topbar()}
    <div class="shell">
      ${rail()}
      ${tree()}
      <div class="vdivider"><span></span></div>
      <main class="main">
        ${tabbar()}
        <div class="surface">
          ${modeRow()}
          ${urlRow()}
          ${reqTabs()}
          ${reqBody()}
          ${hsplit()}
          ${resp()}
        </div>
      </main>
    </div>
    ${state.statusbar ? statusbar() : ''}
  </div>`;
}

/* =====================================================================
   Comparison shell
   ===================================================================== */
const designCanvas = document.getElementById('designCanvas');
const designWrap = document.getElementById('designWrap');
const refWrap = document.getElementById('refWrap');
const refOverlay = document.getElementById('refOverlay');
const gridOverlay = document.getElementById('gridOverlay');
const zoomInput = document.getElementById('zoom');
const zoomVal = document.getElementById('zoomVal');
const opacityInput = document.getElementById('opacity');
const opacityVal = document.getElementById('opacityVal');
const modeSeg = document.getElementById('modeSeg');
const gridToggle = document.getElementById('gridToggle');
const statusToggle = document.getElementById('statusToggle');
const filledToggle = document.getElementById('filledToggle');

let compareMode = 'design';
let zoom = 100;

function renderApp() {
  designCanvas.innerHTML = appHTML();
}

function applyView() {
  const showDesign = compareMode === 'design' || compareMode === 'side' || compareMode === 'overlay';
  const showRef = compareMode === 'reference' || compareMode === 'side';
  designWrap.hidden = !showDesign;
  refWrap.hidden = !showRef;
  refOverlay.style.opacity =
    compareMode === 'overlay' ? String(Number(opacityInput.value) / 100) : '0';
  const scale = zoom / 100;
  designWrap.style.zoom = String(scale);
  refWrap.style.zoom = String(scale);
  gridOverlay.classList.toggle('on', gridToggle.checked);
  zoomVal.textContent = `${zoom}%`;
  opacityVal.textContent = `${opacityInput.value}%`;
}

function setCompareMode(mode) {
  compareMode = mode;
  for (const button of modeSeg.querySelectorAll('button')) {
    button.classList.toggle('active', button.dataset.pmode === mode);
  }
  if (mode === 'side') {
    zoom = 62;
    zoomInput.value = '62';
  } else {
    zoom = 100;
    zoomInput.value = '100';
  }
  applyView();
}

modeSeg.addEventListener('click', (event) => {
  const button = event.target.closest('[data-pmode]');
  if (button) setCompareMode(button.dataset.pmode);
});
zoomInput.addEventListener('input', () => {
  zoom = Number(zoomInput.value);
  applyView();
});
opacityInput.addEventListener('input', applyView);
gridToggle.addEventListener('change', applyView);
statusToggle.addEventListener('change', () => {
  state.statusbar = statusToggle.checked;
  renderApp();
  applyView();
});
filledToggle.addEventListener('change', () => {
  state.responseFilled = filledToggle.checked;
  renderApp();
  applyView();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  state.mode = '调试';
  state.reqTab = 'Body';
  state.bodyType = 'none';
  state.respTab = '实时响应';
  state.folderOpen = false;
  state.responseFilled = false;
  state.statusbar = false;
  filledToggle.checked = false;
  statusToggle.checked = false;
  gridToggle.checked = false;
  opacityInput.value = '45';
  renderApp();
  setCompareMode('design');
});

designCanvas.addEventListener('click', (event) => {
  const button = event.target.closest('[data-act]');
  if (!button) return;
  const [action, ...rest] = button.dataset.act.split(':');
  const value = rest.join(':');
  if (action === 'mode') {
    state.mode = value;
    renderApp();
  } else if (action === 'reqtab') {
    state.reqTab = value;
    renderApp();
  } else if (action === 'bodytype') {
    state.bodyType = value;
    renderApp();
  } else if (action === 'resptab') {
    state.respTab = value;
    renderApp();
  } else if (action === 'folder') {
    state.folderOpen = !state.folderOpen;
    renderApp();
  } else if (action === 'send') {
    state.responseFilled = true;
    filledToggle.checked = true;
    renderApp();
  }
});

renderApp();
applyView();
</script>
</body>
</html>
