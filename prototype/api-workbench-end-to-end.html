<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Api Workbench 端到端交互原型</title>
<style>
  :root{
    --bg:#f5f1e8;
    --panel:#fffdf8;
    --panel-2:#faf6ed;
    --ink:#2b251c;
    --muted:#8b8070;
    --line:#e5ddcf;
    --line-strong:#d8cdb9;
    --accent:#ad7a27;
    --accent-soft:#f4e8d0;
    --ok:#2f7d4f;
    --ok-soft:#e6f2ea;
    --bad:#b14435;
    --bad-soft:#f8e8e5;
    --warn:#9a6a12;
    --warn-soft:#fbf0d8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  }
  .wrap{max-width:1600px;margin:0 auto;padding:22px 22px 60px}
  h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.01em}
  h1{font-size:22px}
  h3{font-size:14px}
  p{margin:0}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .tiny{font-size:12px}

  header.top{
    display:flex;flex-direction:column;gap:10px;
    padding:20px 22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  }
  .top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;letter-spacing:.08em;
    border:1px solid #e8d6b4;
  }
  .question{
    margin-top:2px;padding:10px 12px;background:var(--panel-2);border-left:3px solid var(--accent);
    border-radius:6px;color:#4b4336;font-size:13.5px;
  }
  .notice{
    display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:8px;
    background:var(--accent-soft);border:1px solid #e8d6b4;color:#5c4a28;font-size:13px;
  }
  .notice strong{color:var(--accent)}

  nav.scenarios{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
  nav.scenarios button{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    font-weight:600;font-size:13px;color:#5c5346;
  }
  nav.scenarios button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  nav.scenarios button:hover{border-color:var(--accent)}

  .scenario-bar{
    display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;
  }
  .scenario-bar .desc{max-width:900px}
  .scenario-bar h2{font-size:15px;margin-bottom:4px}
  .progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .progress .bar{width:120px;height:6px;border-radius:999px;background:#eee6d8;overflow:hidden}
  .progress .bar i{display:block;height:100%;background:var(--accent)}

  .layout{display:grid;grid-template-columns:300px minmax(460px,1fr) 420px;gap:14px;align-items:start}
  @media (max-width:1320px){.layout{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
  .card.flash{border-color:#dcbf8b;box-shadow:0 0 0 2px var(--accent-soft) inset}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .card-head .title{display:flex;align-items:center;gap:7px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px}

  button{
    font:inherit;cursor:pointer;border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    border-radius:7px;padding:6px 10px;font-size:12.5px;transition:border-color .12s, background .12s;
  }
  button:hover:not(:disabled){border-color:var(--accent);background:#fffdf7}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#96681f;border-color:#96681f}
  button.ghost{background:transparent}
  button:disabled{opacity:.42;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}

  .steps-list{display:flex;flex-direction:column;gap:8px}
  .step{
    display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:start;
    padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);
  }
  .step.done{opacity:.62;background:#f7f3ea}
  .step.current{border-color:var(--accent);background:#fffaf0}
  .step .num{
    width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    background:#fff;border:1px solid var(--line-strong);font-size:11.5px;font-weight:700;color:#6b6152;
  }
  .step.current .num{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
  .step .text{font-size:12.5px;line-height:1.45}
  .step .step-hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .step button{white-space:nowrap}

  .free-group{margin-bottom:10px}
  .free-group h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .free-group .btn-row{gap:6px}

  .empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--panel-2)}

  .tree{display:flex;flex-direction:column;gap:4px}
  .tree-row{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    border-radius:7px;padding:6px 8px;font-size:12.5px;
  }
  .tree-row:hover{background:var(--panel-2);border-color:var(--line)}
  .tree-row.sel{background:var(--accent-soft);border-color:#e2cca4}
  .method{
    font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.03em;
    background:#eee8dc;color:#5a5042;
  }
  .method.GET{background:#e6f0ea;color:#2f6f4b}
  .method.POST{background:#f5ead4;color:#8a5c12}
  .method.PUT{background:#e8ecf7;color:#3b4f8a}
  .method.DELETE{background:#f7e6e3;color:#96362a}
  .tree-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
  td{padding:4px 6px;border-bottom:1px solid #f0ebe1;vertical-align:top}
  tr:last-child td{border-bottom:none}

  .pill{
    display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;
    border:1px solid transparent;white-space:nowrap;
  }
  .pill.good{background:var(--ok-soft);color:var(--ok);border-color:#c9e2d3}
  .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:#eccdc8}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#ecd9ad}
  .pill.idle{background:#f0ece4;color:#7b7162;border-color:#e2dbcd}
  .pill.skip{background:#f0ece4;color:#8b8070;border-color:#ddd5c6}

  .url-box{
    display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;
    background:#fff;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;
  }
  textarea{
    width:100%;min-height:92px;resize:vertical;border:1px solid var(--line-strong);border-radius:7px;padding:8px 9px;
    font-family:var(--mono);font-size:12px;background:#fff;color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  pre{
    margin:0;padding:10px;background:#2c2822;color:#f1eadc;border-radius:8px;font-family:var(--mono);
    font-size:11.5px;line-height:1.5;max-height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;
  }
  pre.light{background:var(--panel-2);color:#403a30;border:1px solid var(--line)}

  .timeline{display:flex;flex-direction:column;gap:6px}
  .tl-row{display:grid;grid-template-columns:26px 70px 1fr auto;gap:8px;align-items:start;padding:6px 7px;border:1px solid var(--line);border-radius:7px;background:#fff}
  .tl-row.current{border-color:var(--accent);background:#fffaf0}
  .tl-row .idx{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;padding-top:2px}
  .type-chip{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:#eee8dc;color:#635847;text-align:center}
  .type-chip.script{background:#e8ecf7;color:#3b4f8a}
  .type-chip.assert{background:#f5ead4;color:#8a5c12}
  .type-chip.if{background:#efe7f5;color:#6a4386}
  .tl-detail{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f0ebe1}
  .switch-row:last-child{border-bottom:none}
  .switch-row .lbl{font-size:12.5px}
  .switch{
    min-width:56px;font-weight:700;font-size:11.5px;border-radius:999px;padding:3px 9px;
  }
  .switch.on{background:var(--ok-soft);color:var(--ok);border-color:#c9e2d3}
  .switch.off{background:#f0ece4;color:#7b7162;border-color:#e2dbcd}

  .log{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .log-row{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;padding:5px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
  .log-row .why{color:var(--muted)}

  .state-section{margin-bottom:12px}
  .state-section:last-child{margin-bottom:0}
  .state-title{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#7a6f5e;text-transform:uppercase;margin-bottom:6px;
  }
  .kv{display:grid;grid-template-columns:88px 1fr;gap:3px 8px;font-size:12px}
  .kv .k{color:var(--muted)}
  .kv .v{overflow-wrap:anywhere}
  .file-list{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:11px}
  .file-row{display:flex;gap:6px;align-items:baseline;padding:3px 5px;border-radius:4px;background:var(--panel-2)}
  .file-row .op{color:var(--accent);font-weight:700;flex:0 0 auto}
  .file-row .p{overflow-wrap:anywhere;color:#4d4539}

  details.raw{margin-top:6px}
  details.raw summary{cursor:pointer;font-size:11.5px;color:var(--muted);padding:3px 0}
  details.raw pre{margin-top:6px;max-height:360px}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:620px){.two-col{grid-template-columns:1fr}}
  .tag-inline{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-row">
      <span class="badge">PROTOTYPE · 一次性 · 不接真实网络</span>
      <h1>Api Workbench 端到端交互原型</h1>
      <span class="muted tiny">刷新页面即完全重置</span>
    </div>
    <p class="muted tiny">这是用于确认方案的交互原型：逻辑是模拟的，不发送真实 HTTP，也不写真实文件。重点是让你手动推演「状态怎么变、数据落在哪、权限在哪一步拦住」。</p>
    <div class="question">
      <strong>要确认的问题：</strong>从「建项目 → 配环境 → 发请求 → 存记录 → 断言 → 流程自动化（含失败与跳过）→ MCP 调用」，
      这套数据模型、状态流转和权限分层是否顺手？哪些地方反直觉？
    </div>
    <div class="notice"><span>💡</span><span>左侧按场景一步步点；中栏是模拟的产品界面；右栏是每一步之后的<strong>完整状态与落盘文件</strong>。也可以切到「自由操作」任意组合。</span></div>
  </header>

  <nav class="scenarios" id="scenarioNav"></nav>

  <section class="scenario-bar" id="scenarioBar"></section>

  <main class="layout">
    <div class="col" id="steps"></div>
    <div class="col" id="app"></div>
    <div class="col" id="statePanel"></div>
  </main>

</div>

<script>
/* =====================================================================
   纯逻辑模块（无 DOM）——回答「状态模型是否成立」
   可以整段抽走放进真实代码；页面只是它的外壳。
   ===================================================================== */
const MCP_TOOLS = {
  apipost_list_projects:          { write:false, execute:false, label:'列项目（只读）' },
  apipost_delete_apis:            { write:true,  execute:false, label:'删接口（写）' },
  apipost_execute_api:            { write:false, execute:true,  label:'跑接口（执行）' },
  apipost_create_execution_flow:  { write:true,  execute:true,  label:'建流程（写+执行）' }
};

const Logic = (() => {
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const MAX_FILES = 60;
  const MAX_SENDS = 30;

  function initialState() {
    return {
      seq: 100,
      project: null,
      folders: [],
      apis: [],
      env: null,
      globalVars: [],
      selectedApiId: null,
      lastSend: null,
      sends: [],
      flow: null,
      flowRun: null,
      mock: { loginOk: true },
      mcp: { enabled: true, allow_write: false, allow_execute: false, allowed_project_ids: [] },
      mcpLog: [],
      files: [],
      notice: '等待操作',
      changed: []
    };
  }

  function touch(s, path, op, note) {
    s.files.unshift({ path, op: op || 'write', note: note || '', n: ++s.seq });
    if (s.files.length > MAX_FILES) s.files.length = MAX_FILES;
  }

  function variableMap(s) {
    const map = {};
    for (const v of s.globalVars) {
      map[v.key] = (v.current_value !== undefined && v.current_value !== '') ? v.current_value : v.value;
    }
    if (s.env) {
      map.baseUrl = s.env.base_url;
      for (const v of s.env.variables) {
        map[v.key] = (v.current_value !== undefined && v.current_value !== '') ? v.current_value : v.value;
      }
    }
    return map;
  }

  function resolveTemplate(tpl, map) {
    const unresolved = new Set();
    const value = String(tpl == null ? '' : tpl).replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, key) => {
      const v = map[key];
      if (v === undefined || v === null || v === '') { unresolved.add(key); return m; }
      return String(v);
    });
    return { value, unresolved: Array.from(unresolved) };
  }

  function selectedApi(s) {
    return s.apis.find(a => a.target_id === s.selectedApiId) || null;
  }

  function getPath(obj, path) {
    if (!path) return obj;
    return String(path).split('.').reduce((acc, k) => (acc == null ? undefined : acc[k]), obj);
  }

  function describeAssertion(a) {
    if (!a) return '—';
    if (a.kind === 'status') return `状态码 = ${a.expected}`;
    if (a.kind === 'time') return `耗时 ≤ ${a.expected}ms`;
    if (a.kind === 'json') {
      if (a.op === 'length>') return `JSON ${a.path} 长度 > ${a.expected}`;
      if (a.op === 'exists') return `JSON ${a.path} 存在`;
      return `JSON ${a.path} = ${a.expected}`;
    }
    if (a.kind === 'bodyContains') return `响应体包含「${a.expected}」`;
    return a.kind;
  }

  function evalAssertion(a, res) {
    if (!res) return { pass:false, actual:'无响应' };
    if (res.status === 0) return { pass:false, actual:res.error || '网络错误' };
    if (a.kind === 'status') return { pass:res.status === Number(a.expected), actual:String(res.status) };
    if (a.kind === 'time') return { pass:(res.elapsedMs || 0) <= Number(a.expected), actual:(res.elapsedMs || 0) + 'ms' };
    if (a.kind === 'bodyContains') return { pass:JSON.stringify(res.body || '').includes(String(a.expected)), actual:'见响应体' };
    if (a.kind === 'json') {
      const val = getPath(res.body, a.path);
      if (a.op === 'length>') return { pass:Array.isArray(val) && val.length > Number(a.expected), actual:Array.isArray(val) ? String(val.length) : '非数组' };
      if (a.op === 'exists') return { pass:val !== undefined && val !== null, actual:val === undefined ? '不存在' : JSON.stringify(val) };
      return { pass:String(val) === String(a.expected), actual:JSON.stringify(val) };
    }
    return { pass:false, actual:'未知断言类型' };
  }

  function jsonRes(status, obj, path) {
    const text = JSON.stringify(obj);
    return {
      status,
      headers: { 'content-type':'application/json; charset=utf-8' },
      body: obj,
      text,
      elapsedMs: 42 + (String(path).length * 7) % 90,
      size: text.length
    };
  }

  function mockResponse(s, method, url, headers, body) {
    let u;
    try { u = new URL(url); } catch (e) {
      return { status:0, headers:{}, body:null, text:'', elapsedMs:0, size:0, error:'无效 URL：' + url };
    }
    if (u.origin !== 'http://127.0.0.1:8090') {
      return { status:0, headers:{}, body:null, text:'', elapsedMs:0, size:0, error:'连接失败 ECONNREFUSED ' + u.host };
    }
    const path = u.pathname;

    if (method === 'POST' && path === '/login') {
      if (!s.mock.loginOk) return jsonRes(401, { error:'用户名或密码错误' }, path);
      return jsonRes(200, { token:'tkn_abc123', user:{ id:1, name:'Ada' } }, path);
    }

    if (method === 'GET' && path === '/orders') {
      const auth = headers['Authorization'] || headers['authorization'];
      if (auth !== 'Bearer tkn_abc123') return jsonRes(401, { error:'unauthorized' }, path);
      return jsonRes(200, { orders:[{ id:1001, total:99.5 }, { id:1002, total:12 }], total:2 }, path);
    }

    const userMatch = path.match(/^\/users\/(\d+)$/);
    if (method === 'GET' && userMatch) {
      const id = Number(userMatch[1]);
      if (id === 404) return jsonRes(404, { error:'user not found' }, path);
      return jsonRes(200, { id, name:'Ada', email:'ada@example.com' }, path);
    }

    if (method === 'POST' && path === '/users') {
      let data;
      try { data = JSON.parse(body || '{}'); } catch (e) { return jsonRes(400, { error:'invalid json' }, path); }
      if (!data.name) return jsonRes(422, { error:'name is required' }, path);
      return jsonRes(201, { id:7, name:data.name, created:true }, path);
    }

    return jsonRes(404, { error:'not found' }, path);
  }

  function upsertVar(list, key, patch) {
    let v = list.find(x => x.key === key);
    if (!v) { v = { key, value:'', current_value:'', description:'' }; list.push(v); }
    Object.assign(v, patch);
    return v;
  }

  function buildFlowEvents(s) {
    const mk = (o) => ({ event_id:'ev_' + (++s.seq), enabled:1, ...o });
    return [
      mk({
        type:'request', name:'登录',
        request:{ method:'POST', path:'/login', headers:{ 'Content-Type':'application/json' }, body:'{"username":"ada","password":"secret"}' }
      }),
      mk({
        type:'script', name:'保存 token 到环境',
        script:'pm.environment.set("token", pm.response.json().token)'
      }),
      mk({
        type:'assert', name:'登录状态码 = 200',
        assertion:{ kind:'status', expected:200 }
      }),
      mk({
        type:'if', name:'token 是否存在',
        condition:'{{token}}'
      }),
      mk({
        type:'request', name:'查询订单',
        request:{ method:'GET', path:'/orders', headers:{ 'Authorization':'Bearer {{token}}' }, body:'' }
      }),
      mk({
        type:'assert', name:'订单数 > 0',
        assertion:{ kind:'json', path:'orders', op:'length>', expected:0 }
      })
    ];
  }

  function reduce(prev, action) {
    const s = clone(prev);
    s.changed = [];
    const a = action || {};

    switch (a.type) {

      case 'CREATE_PROJECT': {
        const id = 'p_' + (++s.seq);
        s.project = { project_id:id, name:a.name || '未命名项目', storage_path:`offline-data/${id}` };
        s.folders = [];
        s.apis = [];
        s.env = null;
        s.globalVars = [];
        s.selectedApiId = null;
        s.lastSend = null;
        s.sends = [];
        s.flow = null;
        s.flowRun = null;
        s.files = [];
        s.mcp.allowed_project_ids = [id]; // 与真实行为一致：create_project 自动授权
        touch(s, `offline-data/${id}/project.json`, 'write', '项目元信息');
        touch(s, `offline-data/${id}/apis/index.json`, 'write', '空目录/接口索引');
        touch(s, `offline-data/${id}/global_params.json`, 'write', '项目级请求默认值');
        s.notice = `项目「${s.project.name}」已创建，并自动加入 MCP 授权列表`;
        s.changed.push('project', 'files', 'mcp');
        break;
      }

      case 'CREATE_FOLDER': {
        if (!s.project) { s.notice = '请先创建项目'; break; }
        const id = 'd_' + (++s.seq);
        s.folders.push({ folder_id:id, parent_id:a.parentId || '0', name:a.name || '新目录' });
        touch(s, `offline-data/${s.project.project_id}/apis/index.json`, 'write', '目录索引');
        s.notice = `目录「${a.name || '新目录'}」已创建`;
        s.changed.push('project', 'files');
        break;
      }

      case 'CREATE_ENV': {
        if (!s.project) { s.notice = '请先创建项目'; break; }
        const id = 'e_' + (++s.seq);
        s.env = { env_id:id, name:a.name || '新环境', base_url:a.baseUrl || 'http://127.0.0.1:8090', variables:[] };
        touch(s, `offline-data/${s.project.project_id}/envs/index.json`, 'write', '环境列表');
        touch(s, `offline-data/${s.project.project_id}/envs/${id}.json`, 'write', '环境与变量');
        s.notice = `环境「${s.env.name}」已创建，base_url = ${s.env.base_url}`;
        s.changed.push('env', 'files');
        break;
      }

      case 'SET_ENV_BASE': {
        if (!s.env) { s.notice = '请先创建环境'; break; }
        s.env.base_url = a.baseUrl || '';
        touch(s, `offline-data/${s.project.project_id}/envs/${s.env.env_id}.json`, 'write', '修改 base_url');
        s.notice = `base_url 已改为 ${s.env.base_url || '（空）'}`;
        s.changed.push('env', 'files');
        break;
      }

      case 'ADD_ENV_VAR': {
        if (!s.env) { s.notice = '请先创建环境'; break; }
        upsertVar(s.env.variables, a.key, {
          value: a.value !== undefined ? a.value : '',
          current_value: a.current_value !== undefined ? a.current_value : '',
          description: a.description || ''
        });
        touch(s, `offline-data/${s.project.project_id}/envs/${s.env.env_id}.json`, 'write', `变量 ${a.key}`);
        s.notice = `环境变量 ${a.key} 已写入（默认值/运行时值双存储）`;
        s.changed.push('env', 'files');
        break;
      }

      case 'ADD_GLOBAL_VAR': {
        if (!s.project) { s.notice = '请先创建项目'; break; }
        upsertVar(s.globalVars, a.key, {
          value: a.value !== undefined ? a.value : '',
          current_value: a.current_value !== undefined ? a.current_value : '',
          description: a.description || ''
        });
        touch(s, `offline-data/${s.project.project_id}/global_params.json`, 'write', `全局变量 ${a.key}`);
        s.notice = `全局变量 ${a.key} 已写入`;
        s.changed.push('env', 'files');
        break;
      }

      case 'CREATE_API': {
        if (!s.project) { s.notice = '请先创建项目'; break; }
        const id = 'a_' + (++s.seq);
        s.apis.push({
          target_id:id,
          parent_id:a.parentId || '0',
          name:a.name || '新接口',
          method:a.method || 'GET',
          url:a.url || '',
          headers:a.headers || [],
          body:a.bodyRaw || '',
          assertions:a.assertions || []
        });
        s.selectedApiId = id;
        s.lastSend = null;
        touch(s, `offline-data/${s.project.project_id}/apis/index.json`, 'write', '更新接口索引');
        touch(s, `offline-data/${s.project.project_id}/apis/${id}.json`, 'write', '接口实体（含 request/断言）');
        s.notice = `接口「${a.name || '新接口'}」已创建并选中`;
        s.changed.push('apis', 'files');
        break;
      }

      case 'SELECT_API': {
        if (s.selectedApiId !== a.id) {
          s.selectedApiId = a.id;
          s.lastSend = null;
          const api = selectedApi(s);
          s.notice = api ? `已选中接口「${api.name}」` : '接口不存在';
          s.changed.push('apis');
        }
        break;
      }

      case 'EDIT_API_BODY': {
        const api = selectedApi(s);
        if (!api) { s.notice = '请先选择接口'; break; }
        api.body = a.raw == null ? '' : a.raw;
        touch(s, `offline-data/${s.project.project_id}/apis/${api.target_id}.json`, 'write', '修改请求体');
        s.notice = '请求体已更新（原型里失焦即生效）';
        s.changed.push('apis', 'files');
        break;
      }

      case 'EDIT_API_URL': {
        const api = selectedApi(s);
        if (!api) { s.notice = '请先选择接口'; break; }
        api.url = a.url || '';
        touch(s, `offline-data/${s.project.project_id}/apis/${api.target_id}.json`, 'write', '修改 URL');
        s.notice = `接口 URL 已改为 ${api.url}`;
        s.changed.push('apis', 'files');
        break;
      }

      case 'ADD_ASSERTION': {
        const api = selectedApi(s);
        if (!api) { s.notice = '请先选择接口'; break; }
        const assertion = {
          id:'as_' + (++s.seq),
          kind:a.kind || 'status',
          expected:a.expected !== undefined ? a.expected : 200,
          path:a.path || '',
          op:a.op || ''
        };
        api.assertions.push(assertion);
        touch(s, `offline-data/${s.project.project_id}/apis/${api.target_id}.json`, 'write', '新增断言');
        s.notice = `已添加断言：${describeAssertion(assertion)}（尚未运行）`;
        s.changed.push('apis', 'files');
        break;
      }

      case 'SEND_REQUEST': {
        const api = selectedApi(s);
        if (!api) { s.notice = '请先选择接口'; break; }
        const map = variableMap(s);
        const urlRes = resolveTemplate(api.url, map);
        const unresolved = new Set(urlRes.unresolved);
        const headerObj = {};
        for (const h of api.headers || []) {
          if (h.enabled === false) continue;
          const hr = resolveTemplate(h.value, map);
          hr.unresolved.forEach(k => unresolved.add(k));
          headerObj[h.key] = hr.value;
        }
        const bodyRes = resolveTemplate(api.body || '', map);
        bodyRes.unresolved.forEach(k => unresolved.add(k));

        let res;
        if (unresolved.size) {
          res = {
            status:0, headers:{}, body:null, text:'', elapsedMs:0, size:0,
            error:'未解析变量：' + Array.from(unresolved).map(k => '{{' + k + '}}').join(', ')
          };
        } else {
          res = mockResponse(s, api.method, urlRes.value, headerObj, bodyRes.value);
        }

        const rec = {
          run_id:'run_' + (++s.seq),
          source:'debug',
          api_id:api.target_id,
          api_name:api.name,
          request:{ method:api.method, url:urlRes.value, headers:headerObj, body:bodyRes.value || null },
          response:res,
          assertions:(api.assertions || []).map(x => ({ ...x, ...evalAssertion(x, res) }))
        };
        s.sends.unshift(rec);
        if (s.sends.length > MAX_SENDS) s.sends.length = MAX_SENDS;
        s.lastSend = rec;
        const pid = s.project.project_id;
        touch(s, `offline-data-local/projects/${pid}/history/${rec.run_id}.json`, 'write', '完整请求/响应');
        touch(s, `offline-data-local/projects/${pid}/history/index.json`, 'write', '最近发送索引');
        s.notice = res.status === 0
          ? `发送失败：${res.error}（仍会记录一条历史）`
          : `发送完成：${res.status} · ${res.elapsedMs}ms · ${res.size}B`;
        s.changed.push('sends', 'files');
        break;
      }

      case 'RUN_ASSERTIONS': {
        const api = selectedApi(s);
        if (!s.lastSend) { s.notice = '请先发送请求，再运行断言'; break; }
        const results = (api && api.assertions ? api.assertions : []).map(x => ({ ...x, ...evalAssertion(x, s.lastSend.response) }));
        s.lastSend = { ...s.lastSend, assertions:results };
        const i = s.sends.findIndex(r => r.run_id === s.lastSend.run_id);
        if (i >= 0) s.sends[i] = s.lastSend;
        const passed = results.filter(r => r.pass).length;
        touch(s, `offline-data-local/projects/${s.project.project_id}/history/${s.lastSend.run_id}.json`, 'write', '写入断言结果');
        s.notice = results.length === 0
          ? '当前接口还没有断言'
          : `断言结果：${passed}/${results.length} 通过`;
        s.changed.push('sends', 'files');
        break;
      }

      case 'CREATE_FLOW': {
        if (!s.project) { s.notice = '请先创建项目'; break; }
        const id = 'f_' + (++s.seq);
        s.flow = { flow_id:id, name:a.name || '登录后查订单', env_id:s.env ? s.env.env_id : null, events:buildFlowEvents(s) };
        s.flowRun = { status:'idle', cursor:0, entries:{}, lastResponse:null, skipped:false, run_id:null };
        touch(s, `offline-data/${s.project.project_id}/executions/flows/${id}.json`, 'write', '流程事件树');
        s.notice = `流程「${s.flow.name}」已创建，共 ${s.flow.events.length} 个事件`;
        s.changed.push('flow', 'files');
        break;
      }

      case 'FLOW_STEP': {
        if (!s.flow) { s.notice = '请先创建流程'; break; }
        if (!s.env) { s.notice = '流程执行前需要环境（用于 baseUrl 与变量）'; break; }
        if (!s.flowRun) s.flowRun = { status:'idle', cursor:0, entries:{}, lastResponse:null, skipped:false, run_id:null };
        const run = s.flowRun;
        if (run.status === 'done') { s.notice = '流程已结束，请先「重置运行」再单步'; break; }

        if (!run.run_id) {
          run.run_id = 'mrun_' + (++s.seq);
          touch(s, `offline-data/${s.project.project_id}/executions/runs/${run.run_id}.json`, 'write', '流程运行记录');
        }

        const ev = s.flow.events[run.cursor];
        if (!ev) { run.status = 'done'; s.notice = '流程已结束'; s.changed.push('flow','files'); break; }

        const entry = { event_id:ev.event_id, type:ev.type, name:ev.name, status:'running', detail:'' };
        run.entries[ev.event_id] = entry;

        if (ev.type === 'request') {
          const map = variableMap(s);
          const pathRes = resolveTemplate(ev.request.path, map);
          const url = (s.env.base_url || '') + pathRes.value;
          const headers = {};
          const unresolved = new Set(pathRes.unresolved);
          for (const [k, v] of Object.entries(ev.request.headers || {})) {
            const hr = resolveTemplate(v, map);
            hr.unresolved.forEach(x => unresolved.add(x));
            headers[k] = hr.value;
          }
          const bodyRes = resolveTemplate(ev.request.body || '', map);
          bodyRes.unresolved.forEach(x => unresolved.add(x));

          const res = unresolved.size
            ? { status:0, headers:{}, body:null, text:'', elapsedMs:0, size:0, error:'未解析变量：' + Array.from(unresolved).map(k => '{{' + k + '}}').join(', ') }
            : mockResponse(s, ev.request.method, url, headers, bodyRes.value);

          run.lastResponse = res;
          entry.status = (res.status >= 200 && res.status < 300) ? 'pass' : 'fail';
          entry.detail = `${ev.request.method} ${url} → ${res.status || '网络错误'}${res.error ? ' · ' + res.error : ''}`;
          entry.request = { method:ev.request.method, url, headers, body:bodyRes.value || null };
          entry.response = res;

          s.sends.unshift({
            run_id:run.run_id + ':' + ev.event_id,
            source:'flow',
            api_name:ev.name,
            request:entry.request,
            response:res,
            assertions:[]
          });
          if (s.sends.length > MAX_SENDS) s.sends.length = MAX_SENDS;
          touch(s, `offline-data-local/projects/${s.project.project_id}/history/${run.run_id}-${ev.event_id}.json`, 'write', '流程内请求记录');

        } else if (ev.type === 'script') {
          const token = run.lastResponse && run.lastResponse.body && run.lastResponse.body.token;
          if (token) {
            upsertVar(s.env.variables, 'token', {
              value:'', current_value:token, description:'流程脚本写入'
            });
            entry.status = 'pass';
            entry.detail = `pm.environment.set("token", "${token}") → 写入 current_value`;
            touch(s, `offline-data/${s.project.project_id}/envs/${s.env.env_id}.json`, 'write', '脚本写入运行时变量 token');
          } else {
            entry.status = 'fail';
            entry.detail = 'pm.response.json().token 不存在，未写入变量';
          }

        } else if (ev.type === 'assert') {
          const r = evalAssertion(ev.assertion, run.lastResponse);
          entry.status = r.pass ? 'pass' : 'fail';
          entry.detail = `期望 ${describeAssertion(ev.assertion)}，实际 ${r.actual}`;

        } else if (ev.type === 'if') {
          const cond = resolveTemplate(ev.condition, variableMap(s));
          const truthy = cond.unresolved.length === 0
            && cond.value !== ''
            && cond.value !== 'undefined'
            && cond.value !== 'null';
          entry.status = truthy ? 'pass' : 'fail';
          entry.detail = `${ev.condition} → ${truthy ? '成立，继续执行' : '不成立，后续步骤全部跳过'}`;
          if (!truthy) {
            run.skipped = true;
            run.status = 'done';
            run.cursor = s.flow.events.length;
          }
        }

        if (!run.skipped) {
          run.cursor += 1;
          if (run.cursor >= s.flow.events.length) run.status = 'done';
        }
        touch(s, `offline-data/${s.project.project_id}/executions/runs/${run.run_id}.json`, 'write', '更新运行记录');
        s.notice = run.status === 'done' ? '流程执行结束' : `已执行事件 ${run.cursor}/${s.flow.events.length}`;
        s.changed.push('flow', 'files', 'env', 'sends');
        break;
      }

      case 'FLOW_RESET': {
        if (!s.flow) { s.notice = '请先创建流程'; break; }
        s.flowRun = { status:'idle', cursor:0, entries:{}, lastResponse:null, skipped:false, run_id:null };
        if (s.env) {
          for (const v of s.env.variables) delete v.current_value;
        }
        s.notice = '流程运行状态与运行时变量（current_value）已重置';
        s.changed.push('flow', 'env');
        break;
      }

      case 'MOCK_LOGIN': {
        s.mock.loginOk = !!a.ok;
        s.notice = a.ok ? 'Mock 登录恢复为成功（200 + token）' : 'Mock 登录改为失败（401，无 token）';
        s.changed.push('flow', 'env');
        break;
      }

      case 'MCP_TOGGLE': {
        if (a.key !== 'enabled' && a.key !== 'allow_write' && a.key !== 'allow_execute') break;
        s.mcp[a.key] = !s.mcp[a.key];
        touch(s, 'offline-data-local/settings/mcp_config.json', 'write', `切换 ${a.key}`);
        s.notice = `MCP ${a.key} → ${s.mcp[a.key] ? '开启' : '关闭'}`;
        s.changed.push('mcp', 'files');
        break;
      }

      case 'MCP_WHITELIST': {
        if (!s.project) { s.notice = '还没有项目可用于授权'; break; }
        const pid = s.project.project_id;
        if (a.remove) {
          s.mcp.allowed_project_ids = s.mcp.allowed_project_ids.filter(x => x !== pid);
          s.notice = '项目已移出 MCP 授权列表';
        } else {
          if (!s.mcp.allowed_project_ids.includes(pid)) s.mcp.allowed_project_ids.push(pid);
          s.notice = '项目已重新加入 MCP 授权列表';
        }
        touch(s, 'offline-data-local/settings/mcp_config.json', 'write', '更新项目白名单');
        s.changed.push('mcp', 'files');
        break;
      }

      case 'MCP_CALL': {
        const spec = MCP_TOOLS[a.tool];
        if (!spec) { s.notice = `未知工具 ${a.tool}`; break; }
        const pid = s.project ? s.project.project_id : null;
        const reasons = [];

        if (!s.mcp.enabled) reasons.push('MCP 总开关未开启');
        if (a.tool !== 'apipost_list_projects') {
          if (!pid) reasons.push('还没有项目');
          else if (!s.mcp.allowed_project_ids.includes(pid)) reasons.push('项目不在授权列表');
        }
        if (spec.write && !s.mcp.allow_write) reasons.push('需要写入权限 allow_write');
        if (spec.execute && !s.mcp.allow_execute) reasons.push('需要执行权限 allow_execute');

        const ok = reasons.length === 0;
        let result = null;

        if (ok) {
          if (a.tool === 'apipost_list_projects') {
            const authorized = pid && s.mcp.allowed_project_ids.includes(pid);
            result = { projects: authorized ? [{ project_id:pid, name:s.project.name, intro:'' }] : [] };
          } else if (a.tool === 'apipost_delete_apis') {
            const ids = (a.args && a.args.target_ids) || [];
            result = { project_id:pid, deleted:ids.length, target_ids:ids };
          } else if (a.tool === 'apipost_execute_api') {
            result = {
              run_id:'run_' + (++s.seq), project_id:pid, status:'passed', scope:'api',
              elapsed_ms:86, total:2, passed:2, failed:[]
            };
            touch(s, `offline-data/${pid}/executions/runs/${result.run_id}.json`, 'write', 'MCP 触发的执行记录');
          } else if (a.tool === 'apipost_create_execution_flow') {
            result = { flow_id:'flow_' + (++s.seq), name:(a.args && a.args.name) || 'MCP 创建流程', message:'created' };
            touch(s, `offline-data/${pid}/executions/flows/${result.flow_id}.json`, 'write', 'MCP 创建的流程');
          }
        }

        s.mcpLog.unshift({
          tool:a.tool,
          ok,
          decision: ok ? '允许' : '拒绝',
          reasons,
          result,
          n:++s.seq
        });
        if (s.mcpLog.length > 20) s.mcpLog.length = 20;

        s.notice = ok
          ? `${a.tool} → 允许（${spec.label}）`
          : `${a.tool} → 拒绝：${reasons.join('；')}`;
        s.changed.push('mcp', 'files');
        break;
      }

      default:
        s.notice = '未知操作';
    }

    s.changed = Array.from(new Set(s.changed));
    return s;
  }

  return {
    initialState,
    reduce,
    selectedApi,
    describeAssertion,
    variableMap
  };
})();

      { text:'添加断言：状态码 = 201', actions:[{ type:'ADD_ASSERTION', kind:'status', expected:201 }], hint:'断言此刻只是配置，还没运行。目标是创建成功时的 201。' },

let state = Logic.initialState();
let currentScenario = 'A';
let stepIndex = 0;

const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const actAttr = (a) => `data-act="${esc(JSON.stringify(a))}"`;
const pretty = (v) => JSON.stringify(v, null, 2);
const has = (key) => state.changed.indexOf(key) >= 0;
const flashCls = (key) => (has(key) ? ' flash' : '');

function statusPill(status, error) {
  if (status === 0) return `<span class="pill bad">网络错误</span>`;
  const cls = (status >= 200 && status < 300) ? 'good' : (status >= 400 ? 'bad' : 'warn');
  return `<span class="pill ${cls}">${status}</span>`;
}
function runStatusPill(entry) {
  if (!entry) return `<span class="pill idle">待执行</span>`;
  if (entry.status === 'pass') return `<span class="pill good">通过</span>`;
  if (entry.status === 'fail') return `<span class="pill bad">失败</span>`;
  return `<span class="pill idle">运行中</span>`;
}
function eventSkipped(ev) {
  const run = state.flowRun;
  return !!(run && run.skipped && !run.entries[ev.event_id]);
}

/* ---------- 场景栏 ---------- */
function renderScenarioNav() {
  const keys = ['A', 'B', 'C', 'D'];
  let html = keys.map(k => {
    const sc = SCENARIOS[k];
    return `<button class="${currentScenario === k ? 'active' : ''}" data-scenario="${k}">${esc(sc.tab)}</button>`;
  }).join('');
  html += `<button class="${currentScenario === 'free' ? 'active' : ''}" data-scenario="free">自由操作</button>`;
  $('#scenarioNav').innerHTML = html;
}

function renderScenarioBar() {
  let title, question, progressHtml;
  if (currentScenario === 'free') {
    title = '自由操作：任意组合动作';
    question = '所有动作都直接可用。适合验证“先做 X 再做 Y”时状态是否仍然合理。';
    progressHtml = `<span class="tag-inline"><span class="dot"></span> 不追踪步骤</span>`;
  } else {
    const sc = SCENARIOS[currentScenario];
    title = sc.title;
    question = sc.question;
    const total = sc.steps.length;
    const done = Math.min(stepIndex, total);
    const pct = Math.round((done / total) * 100);
    progressHtml = `
      <div class="progress">
        <span>${done} / ${total}</span>
        <span class="bar"><i style="width:${pct}%"></i></span>
        <button class="ghost" data-reset-scenario="1">重新开始本场景</button>
      </div>`;
  }
  $('#scenarioBar').innerHTML = `
    <div class="desc">
      <h2>${esc(title)}</h2>
      <p class="muted tiny">${esc(question)}</p>
    </div>
    ${progressHtml}`;
}

/* ---------- 左栏：步骤 / 自由操作 ---------- */
function renderSteps() {
  if (currentScenario === 'free') {
    $('#steps').innerHTML = FREE_GROUPS.map(g => `
      <div class="card">
        <div class="card-head"><div class="title"><h3>${esc(g.title)}</h3></div></div>
        <div class="free-group">
          <div class="btn-row">
            ${g.items.map(it => `<button ${actAttr(it.act)}>${esc(it.label)}</button>`).join('')}
          </div>
        </div>
      </div>`).join('') + `
      <div class="card">
        <div class="card-head"><div class="title"><h3>重置</h3></div></div>
        <button class="primary" ${actAttr({ type:'__RESET_ALL__' })}>清空全部状态</button>
      </div>`;
    return;
  }

  const sc = SCENARIOS[currentScenario];
  const rows = sc.steps.map((st, i) => {
    const done = i < stepIndex;
    const current = i === stepIndex;
    return `
      <div class="step ${done ? 'done' : ''} ${current ? 'current' : ''}">
        <div class="num">${done ? '✓' : i + 1}</div>
        <div>
          <div class="text">${esc(st.text)}</div>
          <div class="step-hint">${esc(st.hint || '')}</div>
        </div>
        ${done
          ? `<button disabled>已完成</button>`
          : current
            ? `<button class="primary" data-step="${i}">执行</button>`
            : `<button disabled>待执行</button>`}
      </div>`;
  }).join('');

  $('#steps').innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="title"><h3>场景步骤</h3></div>
        <span class="muted tiny">按顺序点「执行」</span>
      </div>
      <div class="steps-list">${rows}</div>
      ${stepIndex >= sc.steps.length ? `<div class="notice" style="margin-top:10px"><span>✓</span><span>本场景已完成。你可以点「重新开始本场景」，或切到「自由操作」继续组合。</span></div>` : ''}
    </div>`;
}

function renderApp() {
  const api = Logic.selectedApi(state);
  const p = state.project;
  const r = state.lastSend;

  let html = `<div class="card"><div class="notice"><span>↺</span><span>${esc(state.notice)}</span></div></div>`;

  /* 项目 */

  if (api) {

    html += `
      <div class="card${flashCls('apis')}">
        <div class="card-head">
          <div class="title"><h3>请求</h3><span class="method ${esc(api.method)}">${esc(api.method)}</span></div>

        <div class="two-col" style="margin-top:10px">
          <div>
            <div class="state-title">Headers</div>
            ${(api.headers && api.headers.length)
              ? `<table><tr><th>Key</th><th>Value</th></tr>${api.headers.map(h => `<tr><td class="mono">${esc(h.key)}</td><td class="mono">${esc(h.value)}</td></tr>`).join('')}</table>`
              : `<div class="muted tiny">没有显式 Header。流程里的 Authorization 由事件自己提供。</div>`}
          </div>
          <div>
            <div class="state-title">请求体</div>
            ${(api.method === 'GET' || api.method === 'DELETE')
              ? `<div class="muted tiny">${api.body ? `<pre class="light">${esc(api.body)}</pre>` : '此方法未设置请求体。'}</div>`
              : `<textarea data-body-editor spellcheck="false" placeholder='{"name":"Ada"}'>${esc(api.body || '')}</textarea>
                 <div class="hint">修改后失焦即可生效（会写入 apis/${esc(api.target_id)}.json）。</div>`}
          </div>
        </div>

        <div class="btn-row" style="margin-top:12px">
          <button class="primary" ${actAttr({ type:'SEND_REQUEST' })}>发送请求</button>
          <button ${actAttr({ type:'ADD_ASSERTION', kind:'status', expected:200 })}>+ 断言 状态码=200</button>
          <button ${actAttr({ type:'ADD_ASSERTION', kind:'time', expected:300 })}>+ 断言 耗时≤300ms</button>
          <button ${actAttr({ type:'RUN_ASSERTIONS' })}>运行断言</button>
        </div>

        <div style="margin-top:12px">
          <div class="state-title">断言（${api.assertions.length}）</div>

            ? `<div class="muted tiny">还没有断言。添加后再「发送 / 运行断言」。</div>`
            : `<table>
                <tr><th>断言</th><th>结果</th><th>实际</th></tr>

        <div class="state-title" style="margin-top:10px">Body</div>

  if (state.flow) {
    const run = state.flowRun;
    const tokenVar = state.env ? state.env.variables.find(v => v.key === 'token') : null;

        </div>

        <div class="timeline">
          ${state.flow.events.map((ev, i) => {
            const entry = run ? run.entries[ev.event_id] : null;

            const current = run && run.status !== 'done' && i === run.cursor;
            return `
              <div class="tl-row ${current ? 'current' : ''}">
                <div class="idx">${i + 1}</div>
                <div><span class="type-chip ${esc(ev.type)}">${esc(ev.type)}</span></div>

              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  /* MCP */
  if (currentScenario === 'D' || currentScenario === 'free') {
    const allowed = !!(p && state.mcp.allowed_project_ids.indexOf(p.project_id) >= 0);
    html += `
      <div class="card${flashCls('mcp')}">
        <div class="card-head">
          <div class="title"><h3>MCP</h3></div>
          <span class="muted tiny">每调用一次都会重新检查权限</span>
        </div>
        <div class="switch-row">
          <span class="lbl">总开关 enabled</span>
          <button class="switch ${state.mcp.enabled ? 'on' : 'off'}" ${actAttr({ type:'MCP_TOGGLE', key:'enabled' })}>${state.mcp.enabled ? '已开启' : '已关闭'}</button>
        </div>
        <div class="switch-row">
          <span class="lbl">写入权限 allow_write</span>
          <button class="switch ${state.mcp.allow_write ? 'on' : 'off'}" ${actAttr({ type:'MCP_TOGGLE', key:'allow_write' })}>${state.mcp.allow_write ? '已开启' : '已关闭'}</button>
        </div>
        <div class="switch-row">
          <span class="lbl">执行权限 allow_execute</span>
          <button class="switch ${state.mcp.allow_execute ? 'on' : 'off'}" ${actAttr({ type:'MCP_TOGGLE', key:'allow_execute' })}>${state.mcp.allow_execute ? '已开启' : '已关闭'}</button>
        </div>
        <div class="switch-row">
          <span class="lbl">项目授权 ${allowed ? '<span class="pill good">在列表</span>' : '<span class="pill idle">不在列表</span>'}</span>
          <button ${actAttr({ type:'MCP_WHITELIST', remove:allowed })}>${allowed ? '移出授权' : '加入授权'}</button>
        </div>

        <div class="state-title" style="margin-top:10px">调用工具</div>
        <div class="btn-row">
          ${Object.keys(MCP_TOOLS).map(k => {
            const spec = MCP_TOOLS[k];
            return `<button ${actAttr({ type:'MCP_CALL', tool:k, args: k === 'apipost_delete_apis' ? { target_ids:['a_101'] } : (k === 'apipost_create_execution_flow' ? { name:'MCP 创建流程' } : {}) })}>
              ${esc(k)}<span class="muted tiny"> · ${esc(spec.label)}</span>
            </button>`;
          }).join('')}
        </div>

        <div class="state-title" style="margin-top:12px">调用日志</div>
        ${state.mcpLog.length === 0
          ? `<div class="muted tiny">还没有调用。</div>`
          : `<div class="log">
              ${state.mcpLog.slice(0, 8).map(l => `
                <div class="log-row">
                  ${l.ok ? '<span class="pill good">允许</span>' : '<span class="pill bad">拒绝</span>'}
                  <div>
                    <div class="mono tiny">${esc(l.tool)}</div>
                    <div class="why tiny">${esc(l.ok ? '权限检查全部通过' : l.reasons.join('；'))}</div>
                    ${l.result ? `<div class="mono tiny" style="margin-top:2px">${esc(JSON.stringify(l.result))}</div>` : ''}
                  </div>
                </div>`).join('')}
            </div>`}
      </div>`;
  }

  $('#app').innerHTML = html;
}

/* ---------- 右栏：完整状态 ---------- */
function stateSection(title, key, body) {
  return `
    <div class="state-section card${key ? flashCls(key) : ''}" style="padding:11px 12px">
      <div class="state-title"><span>${esc(title)}</span></div>
      ${body}
    </div>`;
}

function renderStatePanel() {
  const p = state.project;
  const env = state.env;

  const changeLabel = state.changed.length
    ? state.changed.map(k => ({ project:'项目', apis:'接口', env:'环境/变量', sends:'发送记录', flow:'流程', mcp:'MCP', files:'落盘' }[k] || k)).join('、')
    : '无';

  let html = `
    <div class="card">
      <div class="card-head"><div class="title"><h3>当前状态</h3></div><span class="muted tiny">每次操作后全量重绘</span></div>
      <div class="kv">
        <div class="k">最近变化</div><div class="v">${esc(changeLabel)}</div>
        <div class="k">最新提示</div><div class="v">${esc(state.notice)}</div>
        <div class="k">存储根</div><div class="v mono tiny">${p ? esc(p.storage_path) + '/' : '（尚未创建项目）'}</div>
      </div>
    </div>`;

  /* 项目与接口 */
  html += stateSection('项目与接口', 'apis', p ? `
    <div class="kv">
      <div class="k">project_id</div><div class="v mono">${esc(p.project_id)}</div>
      <div class="k">name</div><div class="v">${esc(p.name)}</div>
    </div>
    <table style="margin-top:8px">
      <tr><th>接口</th><th>方法</th><th>URL</th><th>断言</th></tr>
      ${state.apis.length === 0 ? `<tr><td colspan="4" class="muted">（空）</td></tr>` : state.apis.map(a => `
        <tr>
          <td>${esc(a.name)}${a.target_id === state.selectedApiId ? ' <span class="dot"></span>' : ''}</td>
          <td class="mono">${esc(a.method)}</td>
          <td class="mono tiny">${esc(a.url)}</td>
          <td>${a.assertions.length}</td>
        </tr>`).join('')}
    </table>
  ` : `<div class="muted tiny">还没有项目。</div>`);

  /* 环境变量 */
  html += stateSection('环境与变量', 'env', env ? `
    <div class="kv">
      <div class="k">环境</div><div class="v">${esc(env.name)} <span class="mono tiny muted">${esc(env.env_id)}</span></div>
      <div class="k">base_url</div><div class="v mono">${esc(env.base_url)}</div>
      <div class="k">全局变量</div><div class="v mono">${state.globalVars.length ? state.globalVars.map(v => `${esc(v.key)}=${esc(v.value || '')}`).join('，') : '（无）'}</div>
    </div>
    <table style="margin-top:8px">
      <tr><th>key</th><th>默认值 value</th><th>运行时 current_value</th><th>说明</th></tr>
      ${env.variables.length === 0 ? `<tr><td colspan="4" class="muted">（空）</td></tr>` : env.variables.map(v => `
        <tr>
          <td class="mono">${esc(v.key)}</td>
          <td class="mono">${esc(v.value || '')}</td>
          <td class="mono">${v.current_value ? esc(v.current_value) : '<span class="muted">（空）</span>'}</td>
          <td class="tiny muted">${esc(v.description || '')}</td>
        </tr>`).join('')}
    </table>
  ` : `<div class="muted tiny">还没有环境。发送与流程都需要它。</div>`);

  /* 最近发送 */
  html += stateSection('最近发送', 'sends', state.sends.length ? `
    <table>
      <tr><th>来源</th><th>接口</th><th>结果</th><th>耗时</th></tr>
      ${state.sends.slice(0, 8).map(r => `
        <tr>
          <td>${r.source === 'flow' ? '<span class="pill warn">流程</span>' : '<span class="pill idle">调试</span>'}</td>
          <td><div>${esc(r.api_name)}</div><div class="mono tiny muted">${esc(r.request.method)} ${esc(r.request.url)}</div></td>
          <td>${statusPill(r.response.status, r.response.error)}</td>
          <td class="mono">${esc(r.response.elapsedMs)}ms</td>
        </tr>`).join('')}
    </table>
    <div class="hint">共 ${state.sends.length} 条（原型最多保留 30 条）。</div>
  ` : `<div class="muted tiny">还没有发送记录。</div>`);

  /* 流程 */
  html += stateSection('流程运行', 'flow', state.flow ? `
    <div class="kv">
      <div class="k">流程</div><div class="v">${esc(state.flow.name)} <span class="mono tiny muted">${esc(state.flow.flow_id)}</span></div>
      <div class="k">状态</div><div class="v mono">${state.flowRun ? esc(state.flowRun.status) : 'idle'} · cursor ${state.flowRun ? state.flowRun.cursor : 0}/${state.flow.events.length}</div>
      <div class="k">Mock 登录</div><div class="v">${state.mock.loginOk ? '<span class="pill good">成功</span>' : '<span class="pill bad">失败</span>'}</div>
    </div>
    <table style="margin-top:8px">
      <tr><th>#</th><th>事件</th><th>状态</th></tr>
      ${state.flow.events.map((ev, i) => {
        const entry = state.flowRun ? state.flowRun.entries[ev.event_id] : null;
        const skipped = eventSkipped(ev);
        return `<tr>
          <td class="mono">${i + 1}</td>
          <td>${esc(ev.name)} <span class="type-chip ${esc(ev.type)}">${esc(ev.type)}</span></td>
          <td>${skipped ? '<span class="pill skip">跳过</span>' : runStatusPill(entry)}</td>
        </tr>`;
      }).join('')}
    </table>
  ` : `<div class="muted tiny">还没有流程。</div>`);

  /* MCP */
  const allowed = !!(p && state.mcp.allowed_project_ids.indexOf(p.project_id) >= 0);
  html += stateSection('MCP 权限', 'mcp', `
    <div class="kv">
      <div class="k">enabled</div><div class="v">${state.mcp.enabled ? '<span class="pill good">true</span>' : '<span class="pill idle">false</span>'}</div>
      <div class="k">allow_write</div><div class="v">${state.mcp.allow_write ? '<span class="pill good">true</span>' : '<span class="pill idle">false</span>'}</div>
      <div class="k">allow_execute</div><div class="v">${state.mcp.allow_execute ? '<span class="pill good">true</span>' : '<span class="pill idle">false</span>'}</div>
      <div class="k">项目授权</div><div class="v">${allowed ? '<span class="pill good">已授权</span>' : '<span class="pill idle">未授权</span>'} <span class="mono tiny muted">[${esc(state.mcp.allowed_project_ids.join(', '))}]</span></div>
    </div>
    ${state.mcpLog.length ? `<div class="log">
      ${state.mcpLog.slice(0, 4).map(l => `
        <div class="log-row">
          ${l.ok ? '<span class="pill good">允许</span>' : '<span class="pill bad">拒绝</span>'}
          <div><div class="mono tiny">${esc(l.tool)}</div><div class="why tiny">${esc(l.ok ? '全部检查通过' : l.reasons.join('；'))}</div></div>
        </div>`).join('')}
    </div>` : ''}
  `);

  /* 落盘文件 */
  html += stateSection('落盘文件（模拟）', 'files', state.files.length ? `
    <div class="file-list">
      ${state.files.slice(0, 14).map(f => `
        <div class="file-row"><span class="op">${esc(f.op)}</span><span class="p">${esc(f.path)}</span></div>`).join('')}
    </div>
    ${state.files.length > 14 ? `<div class="hint">… 另有 ${state.files.length - 14} 条</div>` : ''}
  ` : `<div class="muted tiny">还没有写入任何文件。</div>`);

  /* 原始状态 */
  html += `
    <div class="card" style="padding:10px 12px">
      <details class="raw">
        <summary>原始状态 JSON（给开发者看）</summary>
        <pre>${esc(pretty(state))}</pre>
      </details>
    </div>`;

  $('#statePanel').innerHTML = html;
}

/* ---------- 动作执行 ---------- */
function runAllFlow() {
  if (!state.flow) return;
  let guard = 0;
  while (guard++ < 30) {
    const before = JSON.stringify(state.flowRun);
    state = Logic.reduce(state, { type:'FLOW_STEP' });
    if (!state.flowRun || state.flowRun.status === 'done') break;
    if (JSON.stringify(state.flowRun) === before) break;
  }
}

function applyActions(actions) {
  for (const a of actions) {
    if (!a) continue;
    if (a.type === 'FLOW_RUN_ALL') runAllFlow();
    else if (a.type === '__RESET_ALL__') state = Logic.initialState();
    else if (a.type === 'NOOP') { /* 仅展示 */ }
    else state = Logic.reduce(state, a);
  }
  render();
}

function switchScenario(key) {
  currentScenario = key;
  stepIndex = 0;
  if (key !== 'free') state = Logic.initialState();
  render();
}

function runGuidedStep(i) {
  if (currentScenario === 'free') return;
  const sc = SCENARIOS[currentScenario];
  if (!sc || i !== stepIndex) return;
  const step = sc.steps[i];
  applyActions(step.actions || []);
  stepIndex = i + 1;
  render();
}

function resetScenario() {
  state = Logic.initialState();
  stepIndex = 0;
  render();
}

function render() {
  renderScenarioNav();
  renderScenarioBar();
  renderSteps();
  renderApp();
  renderStatePanel();
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-scenario]');
  if (tab) { switchScenario(tab.dataset.scenario); return; }

  const reset = e.target.closest('[data-reset-scenario]');
  if (reset) { resetScenario(); return; }

  const stepBtn = e.target.closest('[data-step]');
  if (stepBtn) { runGuidedStep(Number(stepBtn.dataset.step)); return; }

  const apiBtn = e.target.closest('[data-select-api]');
  if (apiBtn) {
    state = Logic.reduce(state, { type:'SELECT_API', id:apiBtn.dataset.selectApi });
    render();
    return;
  }

  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    let act;
    try { act = JSON.parse(actBtn.dataset.act); } catch (err) { return; }
    applyActions([act]);
  }
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-body-editor]')) {
    applyActions([{ type:'EDIT_API_BODY', raw:e.target.value }]);
  }
});

/* ---------- 启动 ---------- */
render();
</script>
</body>
</html>
